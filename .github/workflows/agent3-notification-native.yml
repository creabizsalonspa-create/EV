name: Agent 3 native notification validation

on:
  push:
    branches:
      - development/agent3-notification-center
    paths:
      - '.github/workflows/agent3-notification-native.yml'
      - 'apps/mobile/lib/**'
      - 'apps/mobile/test/support_test.dart'
      - 'apps/mobile/test/preferences_test.dart'
      - 'apps/mobile/test/widget_test.dart'

permissions:
  contents: read

concurrency:
  group: agent3-notification-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-notification:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Android Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            apps/mobile/android/**/*.gradle*
            apps/mobile/android/gradle/wrapper/gradle-wrapper.properties
      - name: Install pinned upstream Flutter
        shell: bash
        run: |
          git clone --depth 1 --branch 3.35.7 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = adc901062556672b4138e18a4dc62a4be8f4b3c2
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-agent3-flutter-3.35.7-${{ hashFiles('apps/mobile/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-agent3-flutter-3.35.7-
      - name: Resolve locked native dependencies
        working-directory: apps/mobile
        run: flutter pub get --enforce-lockfile
      - name: Analyze native notification and support source
        working-directory: apps/mobile
        run: flutter analyze
      - name: Run notification, preference and app startup widget tests
        working-directory: apps/mobile
        run: flutter test --reporter compact test/support_test.dart test/preferences_test.dart test/widget_test.dart
      - name: Verify explicit demo boundary and foreground-only location policy
        run: |
          python3 -B apps/mobile/tool/local_demo_config_test.py
          python3 -B apps/mobile/tool/foreground_location_config_test.py
      - name: Build unsigned Android debug client
        working-directory: apps/mobile
        run: flutter build apk --debug --dart-define=EV_API_BASE_URL=http://127.0.0.1:8000 --dart-define=EV_LOCAL_DEMO=true
      - name: Verify built Android privacy manifest
        working-directory: apps/mobile
        run: python3 tool/check-foreground-location-build.py android
