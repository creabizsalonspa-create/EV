name: Platform validation
on:
  push:
    branches: [development/fullstack-continuation, development/platform-foundation]
  pull_request:
permissions:
  contents: read
# Cancel superseded runs of the same workflow/event/ref. Keep push and PR
# validations separate so a branch push cannot cancel a required PR check.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  business-platform:
    # Pin the browser dependency baseline; ubuntu-latest may advance past Playwright support.
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Validate isolated demo command syntax and explicit consent guard
        run: |
          node --check scripts/client-demo-business.cjs
          node -e 'const r=require("node:child_process").spawnSync(process.execPath,["scripts/client-demo-business.cjs"],{encoding:"utf8"}); if(r.status!==1 || !r.stderr.includes("Usage:")) process.exit(1);'
      - name: Verify mandatory CI trigger coverage and run deduplication
        run: python3 -B -m unittest discover -s tests -p ci_trigger_test.py
      - name: Verify ten-agent integration merge-readiness guard
        run: python3 -B -m unittest discover -s tests -p integration_readiness_test.py
      - name: Verify cross-agent source and finance PR merge prerequisites
        run: python3 -B -m unittest discover -s tests -p integration_dependencies_test.py
      - name: Verify queued Actions cancellation safety controls
        run: python3 -B -m unittest discover -s tests -p ci_queue_triage_test.py
      - run: ./scripts/setup
      - run: ./scripts/php /usr/bin/composer validate --strict
      - run: ./scripts/php vendor/bin/pint --test
      - name: Capture Pint formatting proposal without bypassing lint
        if: failure()
        run: |
          # The preceding --test failure remains authoritative. These proposed
          # corrections are confined to this disposable runner worktree.
          mkdir -p artifacts/pint-review
          ./scripts/php vendor/bin/pint
          git diff --check
          git diff -- services/business-api > artifacts/pint-review/formatter.patch
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: laravel-pint-review-proposal
          path: artifacts/pint-review/formatter.patch
          if-no-files-found: warn
      - name: Check reproducible42-category coverage
        run: |
          python3 scripts/requirement-coverage --check
          python3 -B -m unittest discover -s tests -p requirement_coverage_test.py
      - run: ./scripts/php artisan test --compact
      - run: npm ci
      - name: Verify Agent 9 offline security regression guards
        run: node --test tests/agent9-*.test.cjs
      - run: npx playwright install --with-deps chromium
      - run: ./scripts/start
      - run: npm run test:e2e
      - run: npm run test:frontend
      - run: npm run test:nearby
      - run: npm run test:maps
      - run: npm run test:discovery-routing
      - run: npm run test:localization
      - run: npm run test:web-session
      - run: npm run test:vehicle-models
      - run: ./scripts/csms-setup
      - run: ./scripts/csms-start
      - run: ./scripts/signed-firmware-validator-test
      - run: npm run test:ocpp
      - run: ./scripts/charging-setup
      - run: ./scripts/charging-bridge-setup
      - run: node tests/charging-session.cjs
      - run: node tests/charging-business.cjs
      - run: node tests/charging-client.cjs
      - name: Verify continuous source ingestion and restart
        run: EV_CSMS_CONSUMER=1 EV_CSMS_DAEMON=1 node tests/charging-business.cjs
      - run: npm run test:vendor
      - run: EV_ROAMING_VERIFY_RATE_LIMIT=1 npm run test:roaming
      - run: npm run test:ocpi-provisioning
      - name: Financial browser workflows
        run: |
          set -o pipefail
          mkdir -p artifacts/finance-commercial
          npm run test:commercial | tee artifacts/finance-commercial/browser.txt
          node tests/subscription-dunning.cjs
          node tests/recurring-payments.cjs
          ./scripts/payout-test-setup
          ./scripts/loyalty-test-setup
          ./scripts/battery-test-setup
          docker restart ev-business-api
          ./scripts/start > /tmp/finance-v3-start.txt
          node --test tests/financial-connected.test.cjs
          node tests/financial-connected.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: finance-browser-evidence
          path: |
            artifacts/finance-commercial
            artifacts/finance-v3
            artifacts/finance-corporate
            artifacts/external-disputes
            artifacts/finance-loyalty
          if-no-files-found: warn
      - name: Paced financial history and charger operational regressions
        run: node tests/operational-connected.cjs
      - name: Retain operational suite logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: operational-browser-evidence
          path: artifacts/operational-browser/*.txt
          if-no-files-found: warn
      - name: Retain customer-favorites browser evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: customer-favorites-browser
          path: artifacts/favorites/*.png
          if-no-files-found: warn
      - if: failure()
        run: docker logs --tail 100 ev-business-api

  finance-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/setup
      - run: services/business-api/tests/Postgres/run-finance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgres-finance-evidence
          path: artifacts/finance-postgres/*.txt
          if-no-files-found: error

  connector-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/setup
      - run: services/business-api/tests/Postgres/run-connectors

  staging-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check safe staging config and prove negative test cases
        run: |
          python3 -B -m unittest discover -s tests -p agent3_staging_preflight_test.py
          python3 scripts/staging-release-preflight.py --output artifacts/agent3-preflight/validation.json
      - name: Keep staging preflight evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent3-staging-preflight
          path: artifacts/agent3-preflight/validation.json
          if-no-files-found: warn
      - name: Run all Agent 3 recovery policies and negative security cases
        run: python3 -B -m unittest discover -s tests -p 'agent3_*_test.py' -q
      - name: Verify private staging and synthetic demo regressions without Docker
        run: ./scripts/staging-offline-verify
      - name: Seed synthetic build-context exclusion canaries
        shell: bash
        run: |
          for suffix in sqlite sqlite3 sqlite-wal sqlite3-journal; do
            printf 'synthetic image-exclusion canary\n' > "services/business-api/database/ev-image-guard.$suffix"
          done
          printf 'EV_IMAGE_CANARY=synthetic-only\n' > services/business-api/.env.image-canary
          # The five synthetic canaries must be present on disk to prove they
          # cannot enter Docker, but must not turn a clean committed checkout
          # into an untracked-source failure. Limit exclusions to these exact
          # scratch paths for this one runner; unrelated files remain visible.
          cat >> .git/info/exclude <<'EV_STAGING_CANARIES'
          /services/business-api/database/ev-image-guard.sqlite
          /services/business-api/database/ev-image-guard.sqlite3
          /services/business-api/database/ev-image-guard.sqlite-wal
          /services/business-api/database/ev-image-guard.sqlite3-journal
          /services/business-api/.env.image-canary
          EV_STAGING_CANARIES
      - name: Inspect staging checkout dirtiness without exposing contents
        run: git status --porcelain --untracked-files=normal
      - name: Build pinned staging runtime and verify offline image boundaries
        run: ./scripts/staging-image-build creabiz-ev-business:ci-review
      - name: Verify PostgreSQL17 migrations, HTTP discovery and fresh private-volume ownership
        run: ./scripts/staging-image-smoke creabiz-ev-business:ci-review
      - name: Static validation of disposable recovery runner
        run: |
          bash -n scripts/staging-recovery-smoke
          python3 -m unittest discover -s tests -p agent3_recovery_policy_test.py
          python3 -B -m unittest discover -s tests -p agent3_backup_artifact_guard_test.py
      - name: Verify real disposable PostgreSQL dump and independent Laravel restore
        run: bash scripts/staging-recovery-smoke creabiz-ev-business:ci-review
      - name: Retain non-secret recovery acceptance evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staging-disposable-recovery-evidence
          path: artifacts/agent3-recovery/validation.json
          if-no-files-found: warn

  csms-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate isolated CSMS PostGIS recovery safety policy
        run: |
          bash -n scripts/csms-recovery-smoke
          python3 -m unittest discover -s tests -p agent3_csms_recovery_policy_test.py
          python3 -B -m unittest discover -s tests -p agent3_backup_artifact_guard_test.py
      - name: Verify disposable pinned PostGIS data and recovery-point integrity
        run: bash scripts/csms-recovery-smoke
      - name: Retain non-secret CSMS synthetic recovery evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: csms-disposable-postgis-recovery-evidence
          path: artifacts/agent3-csms-recovery/validation.json
          if-no-files-found: warn

  recovery-acceptance:
    needs: [business-platform, finance-postgres, connector-postgres, staging-image, csms-recovery]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch exact-run Laravel recovery evidence
        uses: actions/download-artifact@v4
        with:
          name: staging-disposable-recovery-evidence
          path: artifacts/recovery-input/business
      - name: Fetch exact-run PostGIS recovery evidence
        uses: actions/download-artifact@v4
        with:
          name: csms-disposable-postgis-recovery-evidence
          path: artifacts/recovery-input/csms
      - name: Reject stale, incomplete or forged acceptance claims
        run: |
          python3 -B -m unittest discover -s tests -p agent3_recovery_evidence_gate_test.py
          python3 scripts/recovery-evidence-gate.py \
            --business artifacts/recovery-input/business/validation.json \
            --csms artifacts/recovery-input/csms/validation.json \
            --sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" \
            --attempt "$GITHUB_RUN_ATTEMPT" \
            --output artifacts/recovery-acceptance/summary.json
      - name: Retain conservative multi-service review summary
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent3-two-store-recovery-summary
          path: artifacts/recovery-acceptance/summary.json
          if-no-files-found: warn
