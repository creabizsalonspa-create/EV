name: Platform validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  business-platform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: ./scripts/setup
      - run: ./scripts/php /usr/bin/composer validate --strict
      - run: ./scripts/php vendor/bin/pint --test
      - name: Check reproducible42-category coverage
        run: |
          python3 scripts/requirement-coverage --check
          python3 -B -m unittest discover -s tests -p requirement_coverage_test.py
      - run: ./scripts/php artisan test --compact
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: ./scripts/start
      - run: npm run test:e2e
      - run: npm run test:frontend
      - run: npm run test:nearby
      - run: npm run test:localization
      - run: npm run test:web-session
      - run: ./scripts/csms-setup
      - run: ./scripts/csms-start
      - run: npm run test:ocpp
      - run: ./scripts/charging-setup
      - run: ./scripts/charging-bridge-setup
      - run: node tests/charging-session.cjs
      - run: node tests/charging-business.cjs
      - run: node tests/charging-client.cjs
      - name: Verify continuous source ingestion and restart
        run: EV_CSMS_CONSUMER=1 EV_CSMS_DAEMON=1 node tests/charging-business.cjs
      - run: npm run test:vendor
      - run: EV_ROAMING_VERIFY_RATE_LIMIT=1 npm run test:roaming
      - run: npm run test:ocpi-provisioning
      - name: Financial browser workflows
        run: |
          set -o pipefail
          mkdir -p artifacts/finance-commercial
          npm run test:commercial | tee artifacts/finance-commercial/browser.txt
          node tests/subscription-dunning.cjs
          node tests/recurring-payments.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: finance-browser-evidence
          path: artifacts/finance-commercial
          if-no-files-found: warn
      - run: npm run test:invoices
      - run: npm run test:tariffs
      - run: npm run test:managed-gate
      - run: npm run test:connectors
      - run: npm run test:reservation-lifecycle
      - run: npm run test:command-recovery
      - name: Charger admission and no-source operational recovery
        run: |
          node tests/charger-ingress.cjs
          node tests/charger-operations.cjs
      - name: Canonical non-default OCPP source targets
        run: EV_CANONICAL_TARGETS=1 EV_CSMS_CONSUMER=1 EV_CSMS_DAEMON=1 node tests/charging-business.cjs
      - name: Customer favorites with paced synthetic authentication
        run: npm run test:favorites
      - name: Retain customer-favorites browser evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: customer-favorites-browser
          path: artifacts/favorites/*.png
          if-no-files-found: warn
      - if: failure()
        run: docker logs --tail 100 ev-business-api

  finance-postgres:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/setup
      - run: services/business-api/tests/Postgres/run-finance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgres-finance-evidence
          path: artifacts/finance-postgres/*.txt
          if-no-files-found: error

  connector-postgres:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/setup
      - run: services/business-api/tests/Postgres/run-connectors
