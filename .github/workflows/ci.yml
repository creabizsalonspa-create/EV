name: Platform validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  business-platform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: ./scripts/setup
      - run: ./scripts/php /usr/bin/composer validate --strict
      - run: ./scripts/php vendor/bin/pint --test
      - run: ./scripts/php artisan test --compact
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: ./scripts/start
      - run: npm run test:e2e
      - run: npm run test:frontend
      - run: npm run test:localization
      - run: ./scripts/csms-setup
      - run: ./scripts/csms-start
      - run: npm run test:ocpp
      - run: ./scripts/charging-setup
      - run: ./scripts/charging-bridge-setup
      - run: node tests/charging-session.cjs
      - run: node tests/charging-business.cjs
      - run: node tests/charging-client.cjs
      - name: Verify continuous source ingestion and restart
        run: EV_CSMS_CONSUMER=1 EV_CSMS_DAEMON=1 node tests/charging-business.cjs
      - run: npm run test:vendor
      - run: EV_ROAMING_VERIFY_RATE_LIMIT=1 npm run test:roaming
      - run: npm run test:invoices
      - run: npm run test:tariffs
      - run: npm run test:managed-gate
      - if: failure()
        run: docker logs --tail 100 ev-business-api

  finance-postgres:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/setup
      - run: services/business-api/tests/Postgres/run-finance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgres-finance-evidence
          path: artifacts/finance-postgres/*.txt
          if-no-files-found: error
