name: Native client validation
on:
  workflow_dispatch:
  push:
    paths: ["apps/mobile/**", ".github/workflows/mobile.yml"]
  pull_request:
    paths: ["apps/mobile/**", ".github/workflows/mobile.yml"]
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        if: runner.os == 'Linux'
        with:
          distribution: temurin
          java-version: "17"
      - name: Install pinned official Flutter source
        shell: bash
        run: |
          git clone --depth 1 --branch 3.35.7 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = adc901062556672b4138e18a4dc62a4be8f4b3c2
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter --version
      - name: Validate native source and tests
        shell: bash
        run: |
          set -o pipefail
          if ! ./apps/mobile/tool/bootstrap 2>&1 | tee "$RUNNER_TEMP/native-validation.log"; then
            python3 - "$RUNNER_TEMP/native-validation.log" <<'PY'
          import pathlib, sys
          detail = pathlib.Path(sys.argv[1]).read_text()[-3600:]
          detail = detail.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=Native validation failure::' + detail)
          PY
            exit 1
          fi
      - run: flutter build apk --debug
        if: runner.os == 'Linux'
        working-directory: apps/mobile
      - run: flutter build ios --simulator --no-codesign
        if: runner.os == 'macOS'
        working-directory: apps/mobile
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: creabiz-android-debug
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
      - name: Archive unsigned simulator application
        if: runner.os == 'macOS'
        run: tar -czf "$RUNNER_TEMP/creabiz-ios-simulator.tar.gz" -C apps/mobile/build/ios/iphonesimulator Runner.app
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: creabiz-ios-simulator
          path: ${{ runner.temp }}/creabiz-ios-simulator.tar.gz
          if-no-files-found: error
      - name: Run native UI integration on iOS simulator (synthetic TLS fixtures)
        timeout-minutes: 15
        if: runner.os == 'macOS'
        shell: bash
        run: |
          device_id=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for group in d["devices"].values() for v in group if v["name"].startswith("iPhone")))')
          xcrun simctl boot "$device_id" || xcrun simctl bootstatus "$device_id" -b
          xcrun simctl bootstatus "$device_id" -b
          cd apps/mobile
          flutter test integration_test/native_flow_test.dart -d "$device_id" --reporter expanded
