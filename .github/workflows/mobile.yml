name: Native client validation
on:
  workflow_dispatch:
  push:
    paths: ["apps/mobile/**", ".github/workflows/mobile.yml", "tests/native-inventory.cjs", "services/business-api/tests/Fixtures/native-inventory.php", "services/business-api/app/Http/Controllers/VendorOpsController.php", "services/business-api/app/Services/VendorOps/**", "services/business-api/routes/vendor_ops.php"]
  pull_request:
    paths: ["apps/mobile/**", ".github/workflows/mobile.yml", "tests/native-inventory.cjs", "services/business-api/tests/Fixtures/native-inventory.php", "services/business-api/app/Http/Controllers/VendorOpsController.php", "services/business-api/app/Services/VendorOps/**", "services/business-api/routes/vendor_ops.php"]
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Select supported Xcode 16.4
        if: runner.os == 'macOS'
        shell: bash
        run: |
          test -d /Applications/Xcode_16.4.app/Contents/Developer
          export DEVELOPER_DIR=/Applications/Xcode_16.4.app/Contents/Developer
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          xcodebuild -version
      - uses: actions/setup-java@v4
        if: runner.os == 'Linux'
        with:
          distribution: temurin
          java-version: "17"
      - name: Install pinned official Flutter source
        shell: bash
        run: |
          git clone --depth 1 --branch 3.35.7 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = adc901062556672b4138e18a4dc62a4be8f4b3c2
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter --version
      - name: Validate native source and tests
        shell: bash
        run: |
          set -o pipefail
          if ! ./apps/mobile/tool/bootstrap 2>&1 | tee "$RUNNER_TEMP/native-validation.log"; then
            python3 - "$RUNNER_TEMP/native-validation.log" <<'PY'
          import pathlib, sys
          detail = pathlib.Path(sys.argv[1]).read_text()[-3600:]
          detail = detail.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=Native validation failure::' + detail)
          PY
            exit 1
          fi
      - run: flutter build apk --debug
        if: runner.os == 'Linux'
        working-directory: apps/mobile
      - name: Verify native inventory against local Laravel
        if: runner.os == 'Linux'
        shell: bash
        run: |
          ./scripts/setup
          ./scripts/start
          node tests/native-inventory.cjs
      - run: flutter build ios --simulator --no-codesign
        if: runner.os == 'macOS'
        working-directory: apps/mobile
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: creabiz-android-debug
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
      - name: Archive unsigned simulator application
        if: runner.os == 'macOS'
        run: tar -czf "$RUNNER_TEMP/creabiz-ios-simulator.tar.gz" -C apps/mobile/build/ios/iphonesimulator Runner.app
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: creabiz-ios-simulator
          path: ${{ runner.temp }}/creabiz-ios-simulator.tar.gz
          if-no-files-found: error
      - name: Create and boot an isolated iPhone simulator
        timeout-minutes: 8
        if: runner.os == 'macOS'
        shell: bash
        run: |
          xcodebuild -version
          xcrun simctl list runtimes
          xcrun simctl list runtimes --json | python3 -c 'import json,sys; assert any(r["identifier"]=="com.apple.CoreSimulator.SimRuntime.iOS-18-5" and r["isAvailable"] for r in json.load(sys.stdin)["runtimes"]), "Required iOS 18.5 runtime is missing"'
          device_id=$(xcrun simctl create "CreaBiz-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" com.apple.CoreSimulator.SimDeviceType.iPhone-16 com.apple.CoreSimulator.SimRuntime.iOS-18-5)
          echo "EV_IOS_DEVICE_ID=$device_id" >> "$GITHUB_ENV"
          xcrun simctl boot "$device_id"
          xcrun simctl bootstatus "$device_id" -b
      - name: Run native UI integration on iOS simulator (synthetic TLS fixtures)
        timeout-minutes: 15
        if: runner.os == 'macOS'
        working-directory: apps/mobile
        run: python3 tool/test-ios-ci
      - name: Capture simulator failure state
        if: failure() && runner.os == 'macOS' && env.EV_IOS_DEVICE_ID != ''
        shell: bash
        run: |
          xcrun simctl io "$EV_IOS_DEVICE_ID" screenshot "$RUNNER_TEMP/ios-failure.png" || true
          xcrun simctl spawn "$EV_IOS_DEVICE_ID" log show --last 5m --style compact --predicate 'process == "Runner"' > "$RUNNER_TEMP/ios-runner.log" 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'macOS'
        with:
          name: creabiz-ios-ui-diagnostics
          path: |
            ${{ runner.temp }}/native-device.log
            ${{ runner.temp }}/ios-failure.png
            ${{ runner.temp }}/ios-runner.log
          if-no-files-found: warn
      - name: Remove this run's simulator
        if: always() && runner.os == 'macOS' && env.EV_IOS_DEVICE_ID != ''
        shell: bash
        run: |
          xcrun simctl shutdown "$EV_IOS_DEVICE_ID" || true
          xcrun simctl delete "$EV_IOS_DEVICE_ID"
