name: Finance commercial validation
on:
  push:
    branches: [development/fullstack-continuation, development/platform-foundation]
    paths:
      - "services/business-api/app/Services/Commercial/**"
      - "services/business-api/app/Http/Controllers/FinancialAnalyticsController.php"
      - "services/business-api/app/Http/Controllers/CommercialCampaignController.php"
      - "services/business-api/public/financial-analytics.js"
      - "services/business-api/public/commercial-campaigns.js"
      - "services/business-api/public/commercial.js"
      - "services/business-api/routes/financial_analytics.php"
      - "services/business-api/routes/campaigns.php"
      - "services/business-api/routes/campaign_delivery.php"
      - "services/business-api/public/hosted-checkout.js"
      - "services/business-api/public/hosted-checkout.css"
      - "services/business-api/public/hosted-return.js"
      - "services/business-api/resources/views/payments/**"
      - "services/business-api/routes/hosted_checkout.php"
      - "services/business-api/routes/web.php"
      - "services/business-api/app/Http/Controllers/HostedCheckoutController.php"
      - "services/business-api/tests/Fixtures/hosted*.php"
      - "tests/hosted-checkout.cjs"
      - "tests/corporate-hosted.cjs"
      - "services/business-api/public/corporate-billing.js"
      - "services/business-api/routes/corporate_hosted*.php"
      - "services/business-api/app/Http/Controllers/CorporateHostedCheckoutController.php"
      - "services/business-api/tests/Fixtures/corporate-hosted*.php"
      - "tests/financial-analytics.cjs"
      - "tests/commercial-campaigns.cjs"
      - "scripts/campaign-test-setup"
      - ".github/workflows/finance-commercial.yml"
  pull_request:
    paths:
      - "services/business-api/app/Services/Commercial/**"
      - "services/business-api/app/Http/Controllers/FinancialAnalyticsController.php"
      - "services/business-api/app/Http/Controllers/CommercialCampaignController.php"
      - "services/business-api/public/financial-analytics.js"
      - "services/business-api/public/commercial-campaigns.js"
      - "services/business-api/public/commercial.js"
      - "services/business-api/routes/financial_analytics.php"
      - "services/business-api/routes/campaigns.php"
      - "services/business-api/routes/campaign_delivery.php"
      - "services/business-api/public/hosted-checkout.js"
      - "services/business-api/public/hosted-checkout.css"
      - "services/business-api/public/hosted-return.js"
      - "services/business-api/resources/views/payments/**"
      - "services/business-api/routes/hosted_checkout.php"
      - "services/business-api/routes/web.php"
      - "services/business-api/app/Http/Controllers/HostedCheckoutController.php"
      - "services/business-api/tests/Fixtures/hosted*.php"
      - "tests/hosted-checkout.cjs"
      - "tests/corporate-hosted.cjs"
      - "services/business-api/public/corporate-billing.js"
      - "services/business-api/routes/corporate_hosted*.php"
      - "services/business-api/app/Http/Controllers/CorporateHostedCheckoutController.php"
      - "services/business-api/tests/Fixtures/corporate-hosted*.php"
      - "tests/financial-analytics.cjs"
      - "tests/commercial-campaigns.cjs"
      - "scripts/campaign-test-setup"
      - ".github/workflows/finance-commercial.yml"
permissions:
  contents: read
# Cancel superseded runs of the same workflow/event/ref. Keep push and PR
# validations separate so a branch push cannot cancel a required PR check.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  financial-browser:
    # Pin the browser dependency baseline; ubuntu-latest may advance past Playwright support.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: ./scripts/setup
      - run: ./scripts/php /usr/bin/composer validate --strict
      - run: ./scripts/php /usr/bin/composer audit --no-interaction
      - run: npm ci
      - name: Install Playwright Chromium and required OS dependencies
        timeout-minutes: 10
        run: npx playwright install --with-deps chromium
      - run: ./scripts/payout-test-setup
      - run: ./scripts/campaign-test-setup
      - run: ./scripts/start > /tmp/finance-commercial-start.txt
      - name: Verify source analytics and commercial campaign workflows
        run: |
          set -o pipefail
          mkdir -p artifacts/financial-analytics artifacts/commercial-campaigns
          node tests/financial-analytics.cjs | tee artifacts/financial-analytics/browser.txt
          node tests/commercial-campaigns.cjs | tee artifacts/commercial-campaigns/browser.txt
          mkdir -p artifacts/hosted-checkout
          node tests/hosted-checkout.cjs | tee artifacts/hosted-checkout/browser.txt
          mkdir -p artifacts/corporate-hosted
          node tests/corporate-hosted.cjs | tee artifacts/corporate-hosted/browser.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: financial-analytics-commercial-campaigns
          path: |
            artifacts/financial-analytics
            artifacts/commercial-campaigns
            artifacts/finance-campaigns
            artifacts/hosted-checkout
            artifacts/corporate-hosted
          if-no-files-found: warn
      - if: failure()
        run: docker logs --tail 80 ev-business-api
