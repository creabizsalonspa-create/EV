name: creabiz_ev
publish_to: none
description: Shared Crea-Biz customer and vendor native client; development integration checkpoint.
version: 0.1.0+1
environment:
  sdk: '>=3.9.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: 2.5.3
  flutter_secure_storage: 9.2.4
  url_launcher: 6.3.2
  file_picker: 10.3.7
  pdfrx: 2.2.24
  flutter_map: 8.3.2
  latlong2: 0.9.1
  geolocator: 14.0.2
  crypto: 3.0.8
dependency_overrides:
  pdfium_flutter:
    path: third_party/pdfium_flutter
dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
  assets:
    - third_party/pdfium_flutter/PDFIUM_LICENSES.txt
